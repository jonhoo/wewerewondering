name: "DynamoDb Local"
description: "Launch and migrate a local instance of DynamoDB"
runs:
  using: "composite"
  steps:
    - name: Download DynamoDB Local
      shell: bash
      run: |
        # The v3.x .tar.gz has returned 403 since early September 2026,
        # while the .zip next to it is still served.
        wget https://d1ni2b6xgvw0s0.cloudfront.net/v3.x/dynamodb_local_latest.zip
        wget https://d1ni2b6xgvw0s0.cloudfront.net/v3.x/dynamodb_local_latest.zip.sha256
        sha256sum --check dynamodb_local_latest.zip.sha256
        unzip dynamodb_local_latest.zip -d dynamodb-local
        ls -lah dynamodb-local
    - name: Install Java SDK
      uses: actions/setup-java@v6
      with:
        distribution: "oracle"
        java-version: "21"
    - name: Launch DynamoDB Local
      shell: bash
      run: |
        cd dynamodb-local
        java -Djava.library.path=./DynamoDBLocal_lib -jar DynamoDBLocal.jar -sharedDb &
    - name: Create tables and indexes in DynamoDb Local
      working-directory: ./server
      shell: bash
      run: ./run-migrations.sh http://localhost:8000
