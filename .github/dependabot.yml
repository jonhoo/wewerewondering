version: 2
updates:
  - package-ecosystem: github-actions
    # "/" is a magic value for this ecosystem, not a literal path: it covers
    # .github/workflows plus a root action.yml. Composite actions in
    # subdirectories are invisible to it, so each one needs its own entry
    # (there is no wildcard; globstars produce duplicate PRs).
    directories:
      - /
      - /.github/actions/client
      - /.github/actions/local-dynamo
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      vite-svelte:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "vite"
          - "@sveltejs/vite-plugin-svelte*"
          - "@sveltejs/vite-plugin-svelte"
          - "svelte"
          - "eslint-plugin-svelte"
          - "prettier-plugin-svelte"
          - "@tailwindcss/vite"
      eslint:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "eslint"
          - "@eslint/js"
          - "@babel/eslint-parser" # https://github.com/eslint/eslint/discussions/20587
      npm-bump:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: monthly
    groups:
      cargo-bump:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
    # TODO: https://github.com/dependabot/dependabot-core/issues/4009
    # versioning-strategy: "increase-if-necessary"
